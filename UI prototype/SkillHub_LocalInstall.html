<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - 本地安装</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            dark: '#0a0a0f',
                            panel: '#12121a',
                            border: '#1e1e2e',
                            accent: '#00d4aa',
                            accent2: '#a855f7',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0f0f16 100%);
            min-height: 100vh;
        }

        /* 玻璃态面板 - 渐变边框 */
        .glass-panel {
            position: relative;
            background: rgba(26, 26, 36, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 16px;
        }
        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.04) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
            transition: opacity 0.3s, background 0.3s;
            pointer-events: none;
        }
        .glass-panel:hover::before {
            opacity: 1;
            background: linear-gradient(135deg,
                rgba(0, 212, 170, 0.3) 0%,
                rgba(168, 85, 247, 0.2) 100%
            );
        }
        .glass-panel-no-hover:hover::before {
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.04) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
        }

        .gradient-text {
            background: linear-gradient(135deg, #00d4aa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 主按钮 */
        .btn-primary {
            background: linear-gradient(135deg, #00d4aa, #a855f7);
            color: #0a0a0f;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 212, 170, 0.25);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 212, 170, 0.4),
                        0 0 30px rgba(0, 212, 170, 0.2);
        }

        /* 次要按钮 */
        .btn-secondary {
            background: rgba(18, 18, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            border-color: rgba(0, 212, 170, 0.4);
            color: #00d4aa;
            background: rgba(0, 212, 170, 0.08);
        }

        /* 图标按钮 */
        .btn-icon {
            width: 36px;
            height: 36px;
            background: rgba(18, 18, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s ease;
        }
        .btn-icon:hover {
            border-color: rgba(0, 212, 170, 0.4);
            color: #00d4aa;
        }

        /* 拖拽区域 */
        .drop-zone {
            transition: all 0.3s ease;
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }
        .drop-zone:hover {
            border-color: rgba(0, 212, 170, 0.5);
            background: rgba(0, 212, 170, 0.05);
        }
        .drop-zone.dragover {
            border-color: #00d4aa;
            background: rgba(0, 212, 170, 0.1);
            box-shadow: 0 0 40px rgba(0, 212, 170, 0.2);
        }

        /* 文件项 */
        .file-item {
            position: relative;
            background: rgba(26, 26, 36, 0.6);
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }
        .file-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.02) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 背景光晕 */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .bg-glow-1 {
            bottom: -200px;
            left: -200px;
            background: #00d4aa;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
    </style>
</head>
<body class="text-gray-300 font-sans">
    <!-- Background Effects -->
    <div class="bg-glow bg-glow-1"></div>

    <!-- Main Container -->
    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="glass-panel glass-panel-no-hover sticky top-0 z-50 rounded-none">
            <div class="max-w-4xl mx-auto px-6 py-4">
                <div class="flex items-center gap-4 relative z-10">
                    <button onclick="goBack()" class="btn-icon">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <div>
                        <h1 class="text-xl font-bold font-mono">
                            <span class="gradient-text">本地</span> <span class="text-white">安装</span>
                        </h1>
                        <p class="text-xs text-gray-500">拖拽或选择本地 Skill 文件</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-2xl">

                <!-- Drop Zone -->
                <div id="dropZone" class="glass-panel glass-panel-no-hover rounded-3xl p-8 mb-6">
                    <div id="uploadArea" class="drop-zone rounded-2xl p-12 text-center cursor-pointer relative z-10" onclick="selectFiles()">
                        <div class="w-24 h-24 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-blue-500/20 to-cyan-500/20 border border-blue-500/30 flex items-center justify-center">
                            <i class="fas fa-cloud-upload-alt text-4xl text-blue-400"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-white mb-3">拖拽文件到此处</h2>
                        <p class="text-sm text-gray-500 mb-6">
                            支持文件夹、<span class="text-cyber-accent">.zip</span> 或 <span class="text-cyber-accent">.skill</span> 压缩包
                        </p>
                        <button class="btn-secondary flex items-center gap-2 mx-auto">
                            <i class="fas fa-folder-open"></i>
                            <span>或点击选择文件</span>
                        </button>

                        <input type="file" id="fileInput" class="hidden" webkitdirectory directory multiple onchange="handleFiles(this.files)">
                    </div>

                    <!-- Selected Files List (Hidden by default) -->
                    <div id="fileList" class="hidden space-y-3 relative z-10">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-semibold text-white">已选择的文件</h3>
                            <button onclick="clearFiles()" class="text-xs text-gray-500 hover:text-red-400 transition-all">
                                <i class="fas fa-trash-alt mr-1"></i>清空
                            </button>
                        </div>

                        <div id="fileItems" class="space-y-2 max-h-64 overflow-y-auto">
                            <!-- File items will be inserted here -->
                        </div>

                        <!-- Install Button -->
                        <div class="mt-6 pt-6 border-t border-cyber-border">
                            <button onclick="startInstall()" class="btn-primary w-full text-lg flex items-center justify-center gap-2">
                                <i class="fas fa-download"></i>
                                <span>确认安装</span>
                            </button>
                        </div>
                    </div>

                    <!-- Installing Progress (Hidden by default) -->
                    <div id="installProgress" class="hidden text-center py-8 relative z-10">
                        <div class="w-20 h-20 mx-auto mb-6 rounded-full border-4 border-cyber-border border-t-cyber-accent animate-spin"></div>
                        <h3 class="text-lg font-semibold text-white mb-2">正在安装...</h3>
                        <p class="text-sm text-gray-500" id="installStatus">正在验证文件...</p>
                    </div>
                </div>

                <!-- Supported Formats -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="glass-panel rounded-xl p-4 text-center">
                        <div class="relative z-10">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-lg bg-cyber-panel flex items-center justify-center">
                                <i class="fas fa-folder text-2xl text-yellow-400"></i>
                            </div>
                            <h4 class="text-sm font-medium text-white mb-1">文件夹</h4>
                            <p class="text-xs text-gray-500">包含 SKILL.md 的目录</p>
                        </div>
                    </div>

                    <div class="glass-panel rounded-xl p-4 text-center">
                        <div class="relative z-10">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-lg bg-cyber-panel flex items-center justify-center">
                                <i class="fas fa-file-archive text-2xl text-purple-400"></i>
                            </div>
                            <h4 class="text-sm font-medium text-white mb-1">ZIP 压缩包</h4>
                            <p class="text-xs text-gray-500">.zip 格式压缩文件</p>
                        </div>
                    </div>

                    <div class="glass-panel rounded-xl p-4 text-center">
                        <div class="relative z-10">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-lg bg-cyber-panel flex items-center justify-center">
                                <i class="fas fa-box text-2xl text-cyber-accent"></i>
                            </div>
                            <h4 class="text-sm font-medium text-white mb-1">Skill 包</h4>
                            <p class="text-xs text-gray-500">.skill 专用格式</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileItems = document.getElementById('fileItems');
        const installProgress = document.getElementById('installProgress');

        // Drag & Drop Events
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function selectFiles() {
            fileInput.click();
        }

        function handleFiles(files) {
            if (files.length === 0) return;

            uploadArea.classList.add('hidden');
            fileList.classList.remove('hidden');

            fileItems.innerHTML = '';

            Array.from(files).forEach((file, index) => {
                const fileItem = createFileItem(file, index);
                fileItems.appendChild(fileItem);
            });
        }

        function createFileItem(file, index) {
            const div = document.createElement('div');
            div.className = 'file-item flex items-center justify-between p-4';

            const fileIcon = getFileIcon(file.name);
            const fileSize = formatFileSize(file.size);

            div.innerHTML = `
                <div class="flex items-center gap-3 relative z-10">
                    <div class="w-10 h-10 rounded-lg bg-cyber-panel flex items-center justify-center">
                        <i class="${fileIcon} text-lg"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-white">${file.name}</p>
                        <p class="text-xs text-gray-500">${fileSize}</p>
                    </div>
                </div>
                <button onclick="removeFile(${index})" class="relative z-10 p-2 rounded-lg hover:bg-red-500/10 hover:text-red-400 transition-all">
                    <i class="fas fa-times"></i>
                </button>
            `;

            return div;
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.zip')) return 'fas fa-file-archive text-purple-400';
            if (filename.endsWith('.skill')) return 'fas fa-box text-cyber-accent';
            if (filename.endsWith('.md')) return 'fas fa-file-code text-blue-400';
            return 'fas fa-folder text-yellow-400';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function removeFile(index) {
            const items = fileItems.children;
            if (items[index]) {
                items[index].remove();
            }

            if (fileItems.children.length === 0) {
                clearFiles();
            }
        }

        function clearFiles() {
            fileList.classList.add('hidden');
            uploadArea.classList.remove('hidden');
            fileInput.value = '';
            fileItems.innerHTML = '';
        }

        function startInstall() {
            fileList.classList.add('hidden');
            installProgress.classList.remove('hidden');

            const statuses = [
                '正在验证文件...',
                '正在解压...',
                '正在解析 SKILL.md...',
                '正在复制到 SkillHub...',
                '安装完成!'
            ];

            let currentStatus = 0;
            const statusElement = document.getElementById('installStatus');

            const interval = setInterval(() => {
                if (currentStatus >= statuses.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        alert('安装成功！文件已添加到您的 Skill 库中。');
                        goBack();
                    }, 500);
                    return;
                }

                statusElement.textContent = statuses[currentStatus];
                currentStatus++;
            }, 1000);
        }

        function goBack() {
            alert('返回上级页面');
        }
    </script>
</body>
</html>
