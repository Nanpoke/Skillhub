<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - SKILL.md 查看器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            dark: '#0a0a0f',
                            panel: '#12121a',
                            border: '#1e1e2e',
                            accent: '#00d4aa',
                            accent2: '#a855f7',
                            glow: 'rgba(0, 212, 170, 0.15)',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: #0a0a0f;
            min-height: 100vh;
        }
        /* 玻璃态面板 - 渐变边框 */
        .glass-panel {
            position: relative;
            background: rgba(26, 26, 36, 0.6);
            backdrop-filter: blur(20px);
        }
        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.04) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .glass-panel-no-hover::before {
            transition: opacity 0.3s, background 0.3s;
        }
        .gradient-text {
            background: linear-gradient(135deg, #00d4aa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        /* 图标按钮 */
        .btn-icon {
            width: 36px;
            height: 36px;
            background: rgba(18, 18, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s ease;
        }
        .btn-icon:hover {
            border-color: rgba(0, 212, 170, 0.4);
            color: #00d4aa;
        }
        .tab-btn {
            transition: all 0.3s ease;
        }
        .tab-btn:hover {
            border-color: rgba(0, 212, 170, 0.3);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.2), rgba(168, 85, 247, 0.2));
            border-color: rgba(0, 212, 170, 0.5);
            color: #00d4aa;
        }
        /* File Tree Styles */
        .file-tree-item {
            transition: all 0.2s;
        }
        .file-tree-item:hover {
            background: rgba(0, 212, 170, 0.05);
        }
        .file-tree-item.active {
            background: rgba(0, 212, 170, 0.1);
            border-left: 2px solid #00d4aa;
        }
        /* Markdown Preview Styles */
        .markdown-body {
            color: #e5e7eb;
            line-height: 1.8;
        }
        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
            border-bottom: 2px solid #1e1e2e;
            padding-bottom: 0.5rem;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #00d4aa;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #a855f7;
        }
        .markdown-body code {
            background: #1e1e2e;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #00d4aa;
        }
        .markdown-body pre {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: #e5e7eb;
        }
        .markdown-body ul, .markdown-body ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body li {
            margin-bottom: 0.5rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #00d4aa;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #9ca3af;
            font-style: italic;
        }
        /* Code View Styles */
        .code-view {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .line-number {
            color: #4b5563;
            text-align: right;
            padding-right: 1rem;
            user-select: none;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1e2e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00d4aa;
        }
    </style>
</head>
<body class="text-gray-300 font-sans">
    <!-- Main Container -->
    <div class="h-screen flex flex-col">
        <!-- Header -->
        <header class="glass-panel glass-panel-no-hover sticky top-0 z-50 rounded-none border-b border-cyber-border">
            <div class="px-6 py-3 relative z-10">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button onclick="goBack()" class="btn-icon">
                            <i class="fas fa-arrow-left text-sm"></i>
                        </button>
                        <div class="flex items-center gap-2 text-sm">
                            <span class="text-gray-500">vercel-react-best-practices</span>
                            <span class="text-gray-600">/</span>
                            <span class="text-white font-mono" id="currentFile">SKILL.md</span>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="flex items-center gap-2">
                        <button onclick="switchTab('files')" id="tab-files" class="tab-btn active px-4 py-2 rounded-lg border border-cyber-border text-sm flex items-center gap-2">
                            <i class="fas fa-folder-tree"></i>
                            <span>文件目录</span>
                        </button>
                        <button onclick="switchTab('preview')" id="tab-preview" class="tab-btn px-4 py-2 rounded-lg border border-cyber-border text-sm flex items-center gap-2">
                            <i class="fas fa-eye"></i>
                            <span>渲染视图</span>
                        </button>
                        <button onclick="switchTab('code')" id="tab-code" class="tab-btn px-4 py-2 rounded-lg border border-cyber-border text-sm flex items-center gap-2">
                            <i class="fas fa-code"></i>
                            <span>代码视图</span>
                        </button>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-2">
                        <button onclick="copyCode()" class="btn-icon" title="复制">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button onclick="downloadFile()" class="btn-icon" title="下载">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex overflow-hidden">
            <!-- File Tree Sidebar -->
            <aside id="fileTreePanel" class="w-64 border-r border-cyber-border bg-cyber-dark/50 overflow-y-auto">
                <div class="p-4">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">文件目录</h3>
                    
                    <div class="space-y-1">
                        <!-- Root -->
                        <div class="file-tree-item active flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer" onclick="selectFile('SKILL.md', this)">
                            <i class="fas fa-file-code text-cyber-accent"></i>
                            <span class="text-sm font-mono">SKILL.md</span>
                        </div>
                        
                        <!-- README -->
                        <div class="file-tree-item flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer" onclick="selectFile('README.md', this)">
                            <i class="fas fa-file-alt text-gray-500"></i>
                            <span class="text-sm font-mono">README.md</span>
                        </div>

                        <!-- Examples Folder -->
                        <div class="mt-2">
                            <div class="flex items-center gap-2 px-3 py-2 text-gray-500">
                                <i class="fas fa-chevron-down text-xs"></i>
                                <i class="fas fa-folder-open text-yellow-400"></i>
                                <span class="text-sm">examples</span>
                            </div>
                            <div class="ml-4 space-y-1">
                                <div class="file-tree-item flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer" onclick="selectFile('examples/basic.tsx', this)">
                                    <i class="fab fa-react text-blue-400"></i>
                                    <span class="text-sm font-mono">basic.tsx</span>
                                </div>
                                <div class="file-tree-item flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer" onclick="selectFile('examples/advanced.tsx', this)">
                                    <i class="fab fa-react text-blue-400"></i>
                                    <span class="text-sm font-mono">advanced.tsx</span>
                                </div>
                            </div>
                        </div>

                        <!-- References Folder -->
                        <div class="mt-2">
                            <div class="flex items-center gap-2 px-3 py-2 text-gray-500">
                                <i class="fas fa-chevron-right text-xs"></i>
                                <i class="fas fa-folder text-yellow-400"></i>
                                <span class="text-sm">references</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Content Panel -->
            <div class="flex-1 overflow-hidden bg-cyber-dark">
                <!-- Markdown Preview -->
                <div id="previewPanel" class="h-full overflow-y-auto hidden">
                    <div class="max-w-4xl mx-auto p-8">
                        <div id="markdownContent" class="markdown-body">
                            <!-- Markdown content will be rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Code View -->
                <div id="codePanel" class="h-full overflow-hidden hidden">
                    <div class="h-full overflow-auto p-6">
                        <pre class="code-view"><code id="codeContent"></code></pre>
                    </div>
                </div>

                <!-- Empty State (for file tree view) -->
                <div id="emptyPanel" class="h-full flex items-center justify-center">
                    <div class="text-center">
                        <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-cyber-panel border border-cyber-border flex items-center justify-center">
                            <i class="fas fa-file-code text-3xl text-cyber-accent"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-white mb-2">选择文件查看</h3>
                        <p class="text-sm text-gray-500">从左侧目录中选择要查看的文件</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Sample SKILL.md content
        const skillContent = `# React Best Practices

## Overview

This skill provides comprehensive React development guidelines based on Vercel's industry-leading practices.

## Component Structure

### 1. Use Functional Components

Always prefer functional components with hooks over class components:

\`\`\`tsx
// ✅ Good
function UserCard({ name, email }: UserCardProps) {
  return (
    <div className="user-card">
      <h3>{name}</h3>
      <p>{email}</p>
    </div>
  );
}

// ❌ Avoid
class UserCard extends React.Component<UserCardProps> {
  render() {
    return (
      <div className="user-card">
        <h3>{this.props.name}</h3>
        <p>{this.props.email}</p>
      </div>
    );
  }
}
\`\`\`

## Hooks Guidelines

### 1. Always use \`use\` prefix

Custom hooks must start with "use":

\`\`\`tsx
// ✅ Good
function useUserData(userId: string) {
  const [user, setUser] = useState(null);
  // ...
}

// ❌ Avoid
function getUserData(userId: string) {
  // This is not a hook!
}
\`\`\`

### 2. Follow Rules of Hooks

- Only call hooks at the top level
- Only call hooks from React functions

## Performance Optimization

### 1. Memoization

Use \`useMemo\` and \`useCallback\` wisely:

\`\`\`tsx
const expensiveValue = useMemo(() => {
  return data.filter(item => item.active).sort((a, b) => b.score - a.score);
}, [data]);

const handleClick = useCallback(() => {
  onSelect(id);
}, [id, onSelect]);
\`\`\`

## File Organization

\`\`\`
src/
├── components/
│   ├── ui/           # Reusable UI components
│   ├── forms/        # Form-specific components
│   └── layouts/      # Layout components
├── hooks/            # Custom React hooks
├── lib/              # Utility functions
├── types/            # TypeScript types
└── styles/           # Global styles
\`\`\`

## Best Practices Summary

> "Write components that are easy to delete, not easy to extend."

1. Keep components small and focused
2. Use TypeScript for type safety
3. Implement proper error boundaries
4. Optimize images and assets
5. Write meaningful tests

---

*Last updated: 2024-01-15*
`;

        let currentView = 'files';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderMarkdown(skillContent);
            showCode(skillContent);
        });

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.add('active');

            // Update panels
            document.getElementById('previewPanel').classList.add('hidden');
            document.getElementById('codePanel').classList.add('hidden');
            document.getElementById('emptyPanel').classList.add('hidden');
            document.getElementById('fileTreePanel').classList.remove('hidden');

            currentView = tab;

            switch(tab) {
                case 'files':
                    document.getElementById('emptyPanel').classList.remove('hidden');
                    break;
                case 'preview':
                    document.getElementById('previewPanel').classList.remove('hidden');
                    document.getElementById('fileTreePanel').classList.add('hidden');
                    break;
                case 'code':
                    document.getElementById('codePanel').classList.remove('hidden');
                    document.getElementById('fileTreePanel').classList.add('hidden');
                    break;
            }
        }

        function selectFile(filename, element) {
            // Update active state
            document.querySelectorAll('.file-tree-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // Update current file display
            document.getElementById('currentFile').textContent = filename;

            // Show preview or code based on file type
            if (filename.endsWith('.md')) {
                document.getElementById('emptyPanel').classList.add('hidden');
                if (currentView === 'preview' || currentView === 'files') {
                    document.getElementById('previewPanel').classList.remove('hidden');
                }
            } else {
                document.getElementById('emptyPanel').classList.add('hidden');
                document.getElementById('codePanel').classList.remove('hidden');
            }
        }

        function renderMarkdown(content) {
            const html = marked.parse(content);
            document.getElementById('markdownContent').innerHTML = html;
        }

        function showCode(content) {
            // Add line numbers
            const lines = content.split('\n');
            const numberedLines = lines.map((line, index) => {
                return `<div class="flex"><span class="line-number w-12">${index + 1}</span><span class="flex-1">${escapeHtml(line)}</span></div>`;
            }).join('');
            
            document.getElementById('codeContent').innerHTML = numberedLines;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]) || '&nbsp;';
        }

        function copyCode() {
            navigator.clipboard.writeText(skillContent).then(() => {
                alert('已复制到剪贴板');
            });
        }

        function downloadFile() {
            alert('下载文件功能');
        }

        function goBack() {
            alert('返回主界面');
        }
    </script>
</body>
</html>
